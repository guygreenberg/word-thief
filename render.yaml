# One-click deploy on Render: New + > Blueprint > pick this repo.
services:
  - type: web
    name: word-thief
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    numInstances: 1 # game state lives in memory, so keep a single instance
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false # Render asks for the value when the Blueprint is created
